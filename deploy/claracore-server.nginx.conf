server {
    listen 80;
    server_name claracore.example.com;

    return 301 https://claracore.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name claracore.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/claracore.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claracore.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/claracore-server.access.log;
    error_log  /var/log/nginx/claracore-server.error.log;

    # 与应用 listener 的边界配套：nginx 先拒绝慢请求和超大请求，
    # 应用仍保留自己的硬限制，防止直连或反代误配置绕过。
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 75s;
    send_timeout 60s;

    location ^~ /mcp {
		client_max_body_size 4m;
        proxy_pass http://127.0.0.1:51890;
        proxy_http_version 1.1;
        # MCP SDK 会对 loopback listener 启用 DNS rebinding 防护。
        # 反代继续透传外部 Host 会被它拒绝为 403；上游 Host 必须保持 loopback。
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Prometheus 指标使用独立 loopback listener，绝不经公网 vhost 暴露。
    location = /metrics {
        return 404;
    }

    location / {
		client_max_body_size 1m;
        proxy_pass http://127.0.0.1:51890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
