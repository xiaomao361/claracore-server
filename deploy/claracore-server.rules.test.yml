rule_files:
  - claracore-server.rules.yml

evaluation_interval: 1m

tests:
  - name: target down and draining stay mutually exclusive
    interval: 1m
    input_series:
      - series: 'up{job="claracore-server", instance="down"}'
        values: '0x12'
      - series: 'claracore_instance_accepting_requests{job="claracore-server", instance="down"}'
        values: '0x12'
      - series: 'up{job="claracore-server", instance="draining"}'
        values: '1x12'
      - series: 'claracore_instance_accepting_requests{job="claracore-server", instance="draining"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: ClaraCoreTargetDown
        exp_alerts:
          - exp_labels:
              component: runtime
              instance: down
              job: claracore-server
              severity: critical
            exp_annotations:
              summary: ClaraCore Server target is down
              description: Prometheus has been unable to scrape down for 2 minutes. Check the process, loopback metrics listener, and host networking.
              runbook: DEPLOYMENT.md section 4.1 and rollback section 5
      - eval_time: 10m
        alertname: ClaraCoreNotAcceptingRequests
        exp_alerts:
          - exp_labels:
              component: runtime
              instance: draining
              job: claracore-server
              severity: warning
            exp_annotations:
              summary: ClaraCore Server remains in draining state
              description: draining is still scrapeable but has refused new business requests for 10 minutes. A normal rollout should finish before this alert fires.
              runbook: DEPLOYMENT.md upgrade section 4

  - name: backup missing and stale receipts do not duplicate
    interval: 1m
    input_series:
      - series: 'claracore_backup_receipt_available{job="claracore-server", instance="missing"}'
        values: '0x16'
      - series: 'claracore_backup_fresh{job="claracore-server", instance="missing"}'
        values: '0x16'
      - series: 'claracore_backup_receipt_available{job="claracore-server", instance="stale"}'
        values: '1x16'
      - series: 'claracore_backup_fresh{job="claracore-server", instance="stale"}'
        values: '0x16'
    alert_rule_test:
      - eval_time: 15m
        alertname: ClaraCoreBackupReceiptMissing
        exp_alerts:
          - exp_labels:
              component: backup
              instance: missing
              job: claracore-server
              severity: critical
            exp_annotations:
              summary: ClaraCore backup verification receipt is unavailable
              description: missing has no valid bounded backup receipt. Check the timer, oneshot service, file permissions, and verifier output.
              runbook: DEPLOYMENT.md backup section 3
      - eval_time: 15m
        alertname: ClaraCoreBackupStale
        exp_alerts:
          - exp_labels:
              component: backup
              instance: stale
              job: claracore-server
              severity: critical
            exp_annotations:
              summary: ClaraCore latest verified backup is stale
              description: stale has a valid receipt, but the archive is outside its configured age budget or the host clock is invalid.
              runbook: DEPLOYMENT.md backup section 3

  - name: external failures suppress stale duplicates
    interval: 1m
    input_series:
      - series: 'claracore_external_health_snapshot_available{job="claracore-server", instance="failed"}'
        values: '1x31'
      - series: 'claracore_external_sources_failed{job="claracore-server", instance="failed"}'
        values: '1x31'
      - series: 'claracore_external_sources_stale{job="claracore-server", instance="failed"}'
        values: '1x31'
      - series: 'claracore_external_health_snapshot_available{job="claracore-server", instance="stale"}'
        values: '1x31'
      - series: 'claracore_external_sources_failed{job="claracore-server", instance="stale"}'
        values: '0x31'
      - series: 'claracore_external_sources_stale{job="claracore-server", instance="stale"}'
        values: '1x31'
    alert_rule_test:
      - eval_time: 30m
        alertname: ClaraCoreExternalSyncFailed
        exp_alerts:
          - exp_labels:
              component: external
              instance: failed
              job: claracore-server
              severity: warning
            exp_annotations:
              summary: ClaraCore external-source sync remains failed
              description: failed has retained at least one failed external source for 15 minutes. Inspect the bounded sync receipt and service logs; metrics contain no source name, URL, tenant, or error text.
              runbook: DEPLOYMENT.md external-source monitoring section 4.1
      - eval_time: 30m
        alertname: ClaraCoreExternalSyncStale
        exp_alerts:
          - exp_labels:
              component: external
              instance: stale
              job: claracore-server
              severity: warning
            exp_annotations:
              summary: ClaraCore external-source mirror is stale
              description: stale has at least one source beyond its computed freshness budget. The rule is suppressed while an explicit sync failure is present to avoid duplicate root-cause notifications.
              runbook: DEPLOYMENT.md external-source monitoring section 4.1

  - name: active claims suppress manual request backlog
    interval: 1m
    input_series:
      - series: 'claracore_external_health_snapshot_available{job="claracore-server", instance="backlog"}'
        values: '1x16'
      - series: 'claracore_external_sync_requests_pending{job="claracore-server", instance="backlog"}'
        values: '1x16'
      - series: 'claracore_external_sync_claims_active{job="claracore-server", instance="backlog"}'
        values: '0x16'
      - series: 'claracore_external_sync_claims_expired{job="claracore-server", instance="backlog"}'
        values: '0x16'
      - series: 'claracore_external_health_snapshot_available{job="claracore-server", instance="active"}'
        values: '1x16'
      - series: 'claracore_external_sync_requests_pending{job="claracore-server", instance="active"}'
        values: '1x16'
      - series: 'claracore_external_sync_claims_active{job="claracore-server", instance="active"}'
        values: '1x16'
      - series: 'claracore_external_sync_claims_expired{job="claracore-server", instance="active"}'
        values: '0x16'
    alert_rule_test:
      - eval_time: 15m
        alertname: ClaraCoreExternalSyncRequestBacklog
        exp_alerts:
          - exp_labels:
              component: external
              instance: backlog
              job: claracore-server
              severity: warning
            exp_annotations:
              summary: ClaraCore manual external-sync request is not being claimed
              description: backlog has retained a pending request without an active or expired claim for 15 minutes. Check the worker loop and persistent request polling.
              runbook: DEPLOYMENT.md external-source monitoring section 4.1
