[program:claracore-server]
command=/opt/claracore-server/current/claracore-server
directory=/opt/claracore-server
user=claracore

; 凭据只放在工作目录的 .env（0600）。这里仅覆盖服务器测试环境的安全公开项。
environment=CCS_ENV="production",CCS_ADDR="127.0.0.1:51890",CCS_PUBLIC_MCP_URL="https://claracore.example.com/mcp",CCS_WEB_SECURE_COOKIE="true",CCS_INGEST_ROOT="/srv/claracore-ingest",CCS_BACKUP_STATUS_FILE="/var/lib/claracore-server/backup-status.json",CCS_RESTORE_STATUS_FILE="/var/lib/claracore-server/restore-status.json",CCS_INTEGRITY_STATUS_FILE="/var/lib/claracore-server/integrity-status.json",CCS_INTEGRITY_MAX_AGE_SEC="90000",CCS_AUTO_CONTEXT_MIN_SCORE="0.55",CCS_AUTO_CONTEXT_MIN_MARGIN="0.03",CCS_EMBEDDING_CACHE_ENTRIES="1024",CCS_EMBEDDING_CACHE_TTL_SEC="86400"

autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30

redirect_stderr=true
stdout_logfile=/var/log/claracore-server/server.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
