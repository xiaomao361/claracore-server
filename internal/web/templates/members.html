{{define "content"}}
{{if .NewPassword}}
<div class="card reveal">
  <h2>{{.ForUser}} 的初始密码</h2>
  <pre class="token">{{.NewPassword}}</pre>
</div>
{{end}}

<form method="post" action="/admin/members" class="card row filter-bar" aria-label="创建成员">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>账号<input name="username" required></label>
  <label>显示名<input name="display"></label>
  <label>角色
    <select name="role">
      <option value="member">member</option>
      <option value="admin">admin</option>
    </select>
  </label>
  <button type="submit">创建账号</button>
</form>

<div class="table-scroll" role="region" aria-label="成员列表" tabindex="0"><table class="grid">
  <thead><tr><th scope="col">账号</th><th scope="col">显示名</th><th scope="col">角色</th><th scope="col">状态</th><th scope="col">创建</th><th scope="col"><span class="visually-hidden">操作</span></th></tr></thead>
  <tbody>
  {{range .Members}}
    <tr class="{{if not .IsActive}}muted{{end}}">
      <td>{{.Username}}</td>
      <td>{{.DisplayName}}{{if .MustChangePw}} <span class="tag">待改密</span>{{end}}</td>
      <td>{{.Role}}</td>
      <td>{{.Status}}</td>
      <td>{{stamp .CreatedAt}}</td>
      <td class="actions">
        <form method="post" action="/admin/members/reset">
          <input type="hidden" name="csrf" value="{{$.CSRF}}">
          <input type="hidden" name="id" value="{{.ID}}">
          <button>重置密码</button>
        </form>
        <form method="post" action="/admin/members/status">
          <input type="hidden" name="csrf" value="{{$.CSRF}}">
          <input type="hidden" name="id" value="{{.ID}}">
          <input type="hidden" name="status" value="{{if .IsActive}}disabled{{else}}active{{end}}">
          <button class="{{if .IsActive}}danger{{end}}">{{if .IsActive}}停用{{else}}启用{{end}}</button>
        </form>
      </td>
    </tr>
  {{end}}
  </tbody>
</table></div>
<p class="hint">停用会立即废掉此人全部 Web 会话；他的 MCP token 也会在下一次调用时失效。</p>
{{end}}
