{{define "content"}}
<p class="page-intro">这里不创建新的治理动作，只把已经存在的质量与运行信号排成一份可以逐项清空的工作单。</p>
<section class="task-list" aria-labelledby="task-list-heading">
  <div class="section-heading"><div><h2 id="task-list-heading">当前待办</h2><p class="hint">按人类判断优先，再到管理员运行维护；数字为 0 表示当前无需处理。</p></div></div>
  {{range .Tasks}}
  <article class="task-card {{if .Attention}}attention{{end}}">
    <div class="task-count" aria-label="{{.Count}} 项"><strong>{{.Count}}</strong><span>项</span></div>
    <div class="task-copy"><h3>{{.Title}}</h3><p>{{.Summary}}</p></div>
    <a href="{{.Href}}">{{.LinkLabel}} →</a>
  </article>
  {{else}}
  <div class="empty-state">暂时无法形成治理待办。请稍后刷新。</div>
  {{end}}
</section>
<p class="hint">待办只汇总你当前有权看到的知识范围；管理员运行项仍只对管理员显示。这里的计数不能代替对具体内容的判断。</p>
{{end}}
