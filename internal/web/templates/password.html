{{define "content"}}
<form method="post" action="/password" class="card narrow">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>当前密码<input name="current" type="password" autocomplete="current-password" required></label>
  <label>新密码<input name="new" type="password" autocomplete="new-password" required></label>
  <label>再输一次<input name="confirm" type="password" autocomplete="new-password" required></label>
  <button type="submit">修改密码</button>
  <p class="hint">改完之后，你在别处已登录的浏览器会全部失效——这是有意的。</p>
</form>
{{end}}
